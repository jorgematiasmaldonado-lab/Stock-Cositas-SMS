<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: una columna de hasta 720px, pensada para el pulgar; navegación fija abajo */
:root{
  --bg:#F1EFF6; --surface:#FFFFFF; --sunken:#F7F5FB; --fg:#17141F; --muted:#5B566B; --line:#E0DCE9;
  --accent:#6D28D9; --on-accent:#FFFFFF; --accent-soft:#EFE7FD;
  --grad:linear-gradient(90deg,#E04FB3,#8B5CF6,#38BDF8);
  --good:#166534; --good-bg:#DCF2E3; --warn:#8A3B0B; --warn-bg:#FCEFD6; --bad:#B42318; --bad-bg:#FBE3E0;
  --display:'Sora',ui-sans-serif,system-ui,sans-serif;
  --body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100D17; --surface:#18141F; --sunken:#1F1A28; --fg:#ECE8F3; --muted:#A39DB3; --line:#2E2839;
  --accent:#C4A5FF; --on-accent:#1C0F33; --accent-soft:#2A1E44;
  --good:#7BD69A; --good-bg:#16301F; --warn:#F2C26B; --warn-bg:#3A2C12; --bad:#F59A8E; --bad-bg:#3B1A17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100D17; --surface:#18141F; --sunken:#1F1A28; --fg:#ECE8F3; --muted:#A39DB3; --line:#2E2839;
  --accent:#C4A5FF; --on-accent:#1C0F33; --accent-soft:#2A1E44;
  --good:#7BD69A; --good-bg:#16301F; --warn:#F2C26B; --warn-bg:#3A2C12; --bad:#F59A8E; --bad-bg:#3B1A17;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
html,body{background:var(--bg);color:var(--fg)}
#copywrap:not([hidden]){display:flex}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
main.wrap{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;min-height:56px;font-size:11.5px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--muted)}
.btn-p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-p:hover{border-color:var(--accent);filter:brightness(1.06)}
.btn-s{min-height:40px;padding:0 12px;font-size:13.5px}
.btn-danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);color:var(--fg);font:inherit}
textarea.inp{padding:10px 12px;min-height:110px}
.lbl{display:block;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-n{background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;align-items:center;gap:12px}
.list>*+*{border-top:1px solid var(--line)}
.bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:4px}
.tape{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap" style="padding-block:10px;display:flex;flex-direction:column;gap:8px">
    <div class="row" style="gap:10px">
      <img id="hdr-logo" alt="" width="44" height="44" style="width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0">
      <div style="min-width:0;flex:1">
        <h1 id="hdr-name" style="font-size:18px;line-height:1.2">Cositas Tecno &amp; Deco</h1>
        <div id="hdr-sub" class="muted" style="font-size:12.5px">Selva Rovetta · San Marcos Sierras</div>
      </div>
      <button class="chip" id="hdr-tema" data-a="tema-toggle" style="width:44px;height:44px;padding:0;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center" aria-label="Cambiar a modo claro"></button>
    </div>
    <button data-a="ir-ajustes" class="row" style="justify-content:space-between;width:100%;background:none;border:0;padding:0;color:inherit;cursor:pointer;font-size:13px;min-height:28px">
      <span class="muted">Dólar de hoy</span><span id="hdr-cotiz" class="pill p-acc num">US$ 1 = $ 0 · cambiar</span>
    </button>
  </div>
</header>

<main id="view" class="wrap"></main>

<nav class="nav" aria-label="Secciones">
  <div class="wrap">
    <button data-a="tab" data-id="inicio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-a="tab" data-id="vender"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.7a1.5 1.5 0 0 0 1.5-1.1L21 8H6"/></svg>Vender</button>
    <button data-a="tab" data-id="stock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Stock</button>
    <button data-a="tab" data-id="ventas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2v20l3-2 2 2 2-2 2 2 2-2 3 2V2l-3 2-2-2-2 2-2-2-2 2z"/><path d="M9 9h6M9 13h6"/></svg>Ventas</button>
    <button data-a="tab" data-id="mas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Más</button>
  </div>
</nav>

<div id="toast" class="toast" hidden></div>
<div id="copywrap" hidden style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;padding:16px">
  <div class="card" style="width:100%;max-width:560px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)">
    <div class="row" style="justify-content:space-between"><strong>Copiá este texto</strong><button class="btn btn-s" data-a="cerrar-copia">Cerrar</button></div>
    <label class="lbl" for="copybox" style="margin:0">Mantené apretado y elegí Copiar</label>
    <textarea id="copybox" class="inp" readonly style="min-height:180px"></textarea>
  </div>
</div>

function ymd(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function hm(d=new Date()){const z=n=>String(n).padStart(2,'0');return z(d.getHours())+':'+z(d.getMinutes())}

function diasAtras(n,h){const d=addDias(new Date(),-n);if(h)d.setHours(h[0],h[1]);return ymd(d)+' '+hm(d)}

function stats(desde,hasta){
  const enR=f=>{const d=String(f).slice(0,10);return d>=desde&&d<=hasta};
  const vs=S.ventas.filter(v=>enR(v.fecha)),gs=S.gastos.filter(g=>enR(g.fecha));
  const tot=sum(vs,v=>v.total),costo=sum(vs,v=>sum(v.items,i=>i.costo*i.cant));
  const envCobro=sum(vs,v=>v.envio?v.envio.cobro:0),envCosto=sum(vs,v=>v.envio?v.envio.costo:0);
  const gastos=sum(gs,g=>g.monto),neta=tot-costo-envCosto-gastos;
  const agg={};vs.forEach(v=>v.items.forEach(i=>{const a=agg[i.nombre]||(agg[i.nombre]={cant:0,monto:0});a.cant+=i.cant;a.monto+=i.precio*i.cant}));
  const pagos={};vs.forEach(v=>{pagos[v.pago]=(pagos[v.pago]||0)+v.total});
  const gcat={};gs.forEach(g=>{gcat[g.categoria]=(gcat[g.categoria]||0)+g.monto});
  return{vs,gs,tot,n:vs.length,costo,envCobro,envCosto,gastos,neta,
    top:Object.entries(agg).sort((a,b)=>b[1].cant-a[1].cant),pagos,gcat,
    unidades:sum(vs,v=>sum(v.items,i=>i.cant)),envios:vs.filter(v=>v.envio).length,
    pendiente:sum(vs.filter(v=>v.estado==='pendiente'),v=>v.total)};
}

  return{ini:new Date(hoy.getFullYear(),hoy.getMonth()+off,1,12),fin:new Date(hoy.getFullYear(),hoy.getMonth()+off+1,0,12)};
}

function listaVender(){

  if(!S.productos.length)return`<p class="muted" style="padding:14px 16px;margin:0">Primero cargá productos en Stock.</p>`;
  if(!ps.length)return`<p class="muted" style="padding:14px 16px;margin:0">No hay productos con ese nombre.</p>`;
  return ps.map(p=>{const enC=cart.find(c=>c.pid===p.id);const libre=p.stock-(enC?enC.cant:0);
    return`<button class="row" data-a="agregar" data-id="${p.id}" ${libre<=0?'disabled':''} style="width:100%;padding:10px 16px;justify-content:space-between;text-align:left;background:none;border:0;color:inherit;cursor:${libre>0?'pointer':'not-allowed'};opacity:${libre>0?1:.5}">

      <span class="row" style="gap:10px"><span class="num">${ars(p.precio)}</span><span class="pill p-acc">${enC?enC.cant+' en venta':'+ Agregar'}</span></span></button>`}).join('');
}
function totalCarrito(){
  const sub=sum(cart,c=>{const p=prod(c.pid);return p?p.precio*c.cant:0});
  const desc=Math.min(sub,num(vf.desc)),env=vf.envio?num(vf.envCobro):0;
  return{sub,desc,env,total:sub-desc+env};
}

function comprobante(v){
  const L=[`*${S.config.negocio}*`];if(S.config.localidad)L.push(S.config.localidad);
  L.push(`Comprobante de compra — ${fechaCorta(v.fecha)}`,'');
  v.items.forEach(i=>L.push(`${i.cant} x ${i.nombre} — ${ars(i.precio*i.cant)}`));
  if(v.descuento)L.push(`Descuento: -${ars(v.descuento)}`);
  if(v.envio)L.push(`Envío${v.envio.direccion?' a '+v.envio.direccion:''}: ${v.envio.cobro?ars(v.envio.cobro):'sin cargo'}`);
  L.push('',`*Total: ${ars(v.total)}*`,`Pago: ${v.pago}${v.estado==='pendiente'?' (pendiente)':''}`,'','¡Gracias por tu compra!');
  return L.join('\n');
}

/* ---------- Cajas ---------- */
function calcCaja(d){
  const lin=d.lineas.map(l=>({...l,cant:num(l.cant),costo:numDec(l.costo)}));
  const subtotal=sum(lin,l=>l.cant*l.costo),extras=numDec(d.extras),f=subtotal>0?extras/subtotal:0;
  return{lin:lin.map(l=>({...l,final:l.costo*(1+f)})),subtotal,extras,total:subtotal+extras,cotiz:num(d.cotiz)||S.config.cotizacion,moneda:d.moneda};
}
function resumenCaja(){
  const c=calcCaja(cajaD),f=v=>enMoneda(c.moneda,v);
  return`${filaMonto('Mercadería',f(c.subtotal))}${filaMonto('Envío, aduana y otros',f(c.extras))}
    ${filaMonto('Total de la caja',f(c.total)+(c.moneda==='USD'?' · '+ars(c.total*c.cotiz):''),{top:true,fuerte:true})}
    ${c.lin.filter(l=>l.cant>0&&l.costo>0).map(l=>{const n=l.pid&&l.pid!=='__nuevo'?(prod(l.pid)||{}).nombre:l.nuevo;return`<div class="row" style="justify-content:space-between;font-size:13px"><span class="muted" style="min-width:0">${esc(n||'Producto')}: costo real c/u</span><span class="num">${f(l.final)}</span></div>`}).join('')}`;
}

function datosReporte(){

}

function textoReporte(){
  const{r,A,B}=datosReporte();
  const L=[`*${S.config.negocio} — Reporte ${rep.tipo==='semana'?'semanal':'mensual'}*`,etiquetaRango(rep.tipo,r),'',
    `Ventas: ${ars(A.tot)} (${A.n} ${A.n===1?'venta':'ventas'}, ${A.unidades} u.)`,
    `Mercadería: ${ars(A.costo)}`,`Envíos: ${ars(A.envCosto)}`,`Gastos: ${ars(A.gastos)}`,`*Ganancia: ${ars(A.neta)}*`];
  if(B.tot)L.push(`Ventas vs. período anterior: ${A.tot>=B.tot?'+':''}${Math.round((A.tot-B.tot)/B.tot*100)}%`);
  if(A.top.length)L.push('',`Lo más vendido: ${A.top[0][0]} (${A.top[0][1].cant} u.)`);
  if(A.pendiente)L.push(`Por cobrar: ${ars(A.pendiente)}`);
  return L.join('\n');
}

function registrarVenta(){
  if(!cart.length)return;
  for(const c of cart){const p=prod(c.pid);if(!p||p.stock<c.cant){toast('No alcanza el stock de '+(p?p.nombre:'un producto'));return}}
  const cot=S.config.cotizacion;
  const items=cart.map(c=>{const p=prod(c.pid);return{pid:p.id,nombre:p.nombre,cant:c.cant,precio:p.precio,costo:Math.round(costoPesos(p))}});
  const t=totalCarrito();
  const envio=vf.envio?{cobro:num(vf.envCobro),costo:num(vf.envCosto),direccion:vf.direccion.trim(),estado:'pendiente'}:null;
  const v={id:uid(),fecha:ymd()+' '+hm(),items,descuento:t.desc,envio,total:t.total,pago:vf.pago,cliente:vf.cliente.trim(),tel:vf.tel.trim(),estado:vf.fiado?'pendiente':'pagada',cotiz:cot};
  items.forEach(i=>{prod(i.pid).stock-=i.cant});
  S.ventas.push(v);guardar();
  cart=[];const pago=vf.pago;vf=vfVacio();vf.pago=pago;ventaOk=v.id;qv='';render();window.scrollTo(0,0);
}

function cerrarForm(guardado){
  if(!guardado)pfNuevas.forEach(id=>delete FOTOS[id]);
  pfNuevas=new Set();pf=null;editId=null;
}
async function subirFotos(files){
  const libres=3-pf.fotos.filter(x=>FOTOS[x]).length;
  if(files.length>libres)toast('Máximo 3 fotos por producto');
  let ok=0;
  for(const f of files.slice(0,Math.max(0,libres))){
    try{const data=await achicar(f);const id='f'+uid();FOTOS[id]=data;pfNuevas.add(id);pf.fotos.push(id);ok++}catch(e){toast('No se pudo leer una de las fotos')}
  }
  if(ok)render();
}
function guardarProducto(){
  const nombre=pf.nombre.trim();if(!nombre){toast('Poné un nombre al producto');return}
  const fotos=pf.fotos.filter(x=>FOTOS[x]);
  const d={icono:{tipo:pf.tipo,dibujo:pf.dibujo,color:pf.color},nombre,variante:pf.variante.trim(),categoria:pf.categoria.trim(),moneda:pf.moneda,costo:numDec(pf.costo),precio:num(pf.precio),stock:Math.max(0,Math.round(num(pf.stock))),minimo:Math.max(0,Math.round(num(pf.minimo))),fotos};
  if(!d.precio&&d.costo)d.precio=sugeridoDe(d.moneda,d.costo);
  fotos.forEach(id=>{if(pfNuevas.has(id))guardarFoto(id,FOTOS[id])});
  if(editId==='nuevo')S.productos.push({id:uid(),...d});
  else{const p=prod(editId);(p.fotos||[]).filter(id=>!fotos.includes(id)).forEach(borrarFoto);Object.assign(p,d);delete p.demo}
  cerrarForm(true);guardar();toast('Producto guardado');render();
}
function respaldo(){const fotos={};S.productos.forEach(p=>(p.fotos||[]).forEach(id=>{if(FOTOS[id])fotos[id]=FOTOS[id]}));return{...S,fotos}}

  const c=calcCaja(cajaD);
  const val=c.lin.filter(l=>l.cant>0&&l.costo>0&&l.pid&&(l.pid!=='__nuevo'||l.nuevo.trim()));
  if(!val.length){toast('Completá al menos un producto con cantidad y costo');return}
  const conv=(v,de,a)=>de===a?v:de==='USD'?v*c.cotiz:v/c.cotiz;
  const lineas=[];
  val.forEach(l=>{
    let p;
    if(l.pid==='__nuevo'){p={id:uid(),nombre:l.nuevo.trim(),categoria:(l.cat||'').trim(),moneda:c.moneda,costo:+l.final.toFixed(2),precio:0,stock:0,minimo:2};p.precio=sugeridoDe(p.moneda,p.costo);S.productos.push(p)}
    else{p=prod(l.pid);const f=conv(l.final,c.moneda,p.moneda);const tot=p.stock+l.cant;p.costo=+(tot>0?(p.stock*p.costo+l.cant*f)/tot:f).toFixed(2)}
    p.stock+=l.cant;
    lineas.push({nombre:p.nombre,cant:l.cant,costo:l.costo,final:+l.final.toFixed(2)});
  });
  S.cajas.push({id:uid(),fecha:cajaD.fecha||ymd(),proveedor:cajaD.proveedor.trim(),moneda:c.moneda,extras:c.extras,cotiz:c.cotiz,lineas,total:c.total});
  cajaD=null;guardar();toast('Caja ingresada. Stock y costos actualizados.');render();
}
function restaurar(txt){
  try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.productos))throw 0;if(d.fotos&&typeof d.fotos==='object'){borrarTodasFotos();Object.entries(d.fotos).forEach(([k,v])=>guardarFoto(k,v))}S=normalizar(d);guardar();cart=[];toast('Copia restaurada');ir('inicio')}
  catch(e){toast('Ese archivo o texto no es una copia válida')}
}

render();
abrirFotos().then(cargarFotos).then(render);

</script>
